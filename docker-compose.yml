version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tradepro-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tradepro_db
    networks:
      - tradepro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradepro-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=tradepro_db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tradepro.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - tradepro-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradepro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - tradepro-network

volumes:
  mongodb_data:

networks:
  tradepro-network:
    driver: bridge